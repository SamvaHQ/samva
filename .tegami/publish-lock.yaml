core:changelogs:
  - content: "---\npackages:\n  \"@samva/better-auth\":\n    type: minor\n  \"@samva/email-sdk\":\n    type: minor\n---\n\n## Require Samva SDK 0.42\n\nBoth adapters now require `samva@^0.42.0` and validate against SDK 0.42.0.\nOnly the current SDK minor is supported; upgrade Samva alongside the adapter.\n\nThe adapter surface is unchanged. `@samva/email-sdk` still calls `email.send` and\n`@samva/better-auth` still calls `messages.send`; neither payload changed in 0.42.\nWhat changed around them:\n\n- Organization-level email domains can be `shared`, so a namespace credential can\n  send from a shared domain's senders.\n- `email.setDefaultSender` takes a request body. Pass `{}` for the sender's own\n  scope or `{ namespaceId }` for a namespace default.\n"
    filename: 2026-11-10-sdk-042.md
    v: 0.0.0
